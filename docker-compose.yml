services:
  9router:
    build:
      context: .
      dockerfile: Dockerfile
    image: 9router:local
    container_name: 9router
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./data-home:/app/data-home
    ports:
      - "127.0.0.1:20128:20128"
    networks:
      - web

networks:
  web:
    external: true
